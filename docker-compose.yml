version: '3.8'

services:
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python server.py
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1

  client-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python client.py --node-id 1 --server-address server:8080
    depends_on:
      - server
    environment:
      - PYTHONUNBUFFERED=1

  client-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python client.py --node-id 2 --server-address server:8080
    depends_on:
      - server
    environment:
      - PYTHONUNBUFFERED=1

  client-c:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python client.py --node-id 3 --server-address server:8080
    depends_on:
      - server
    environment:
      - PYTHONUNBUFFERED=1

  client-d:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python client.py --node-id 4 --server-address server:8080
    depends_on:
      - server
    environment:
      - PYTHONUNBUFFERED=1

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - server
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
